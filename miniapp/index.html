<!doctype html>
<html lang="uz">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover"
    />
    <title>LUSSO BRAND KR</title>
    <meta name="description" content="LUSSO BRAND KR — Koreyadagi premium brend do'kon" />
    <meta name="theme-color" content="#0b0b0c" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,500;0,600;0,700;1,600&family=Manrope:wght@400;600;700;800&display=swap"
    />
    <link rel="icon" type="image/svg+xml" href="/logo.svg" />
    <link rel="apple-touch-icon" href="/logo.svg" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <meta property="og:title" content="LUSSO BRAND KR" />
    <meta property="og:description" content="Koreyadagi premium brend do'kon" />
    <meta property="og:image" content="/logo.svg" />
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <style>
      /* Ilova yuklanguncha ko'rinadigan logo ekrani (JS kutmasdan darhol chiqadi) */
      #splash {
        position: fixed;
        inset: 0;
        z-index: 9999;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 22px;
        background: #0b0b0c;
        transition: opacity 0.45s ease, visibility 0.45s ease;
      }
      #splash.hide {
        opacity: 0;
        visibility: hidden;
      }
      #splash img {
        width: 116px;
        height: 116px;
        border-radius: 28px;
        box-shadow: 0 0 60px rgba(214, 174, 81, 0.25);
        animation: splash-in 0.7s cubic-bezier(0.2, 0.9, 0.3, 1) both;
      }
      #splash .brand {
        color: #d6ae51;
        font: 600 15px/1 Georgia, 'Times New Roman', serif;
        letter-spacing: 0.42em;
        padding-left: 0.42em;
        animation: splash-in 0.7s 0.15s cubic-bezier(0.2, 0.9, 0.3, 1) both;
      }
      #splash .bar {
        width: 120px;
        height: 2px;
        border-radius: 2px;
        background: rgba(214, 174, 81, 0.18);
        overflow: hidden;
      }
      #splash .bar::after {
        content: '';
        display: block;
        width: 40%;
        height: 100%;
        background: #d6ae51;
        animation: splash-bar 1.1s ease-in-out infinite;
      }
      @keyframes splash-in {
        from {
          opacity: 0;
          transform: translateY(12px) scale(0.94);
        }
      }
      @keyframes splash-bar {
        from {
          transform: translateX(-100%);
        }
        to {
          transform: translateX(250%);
        }
      }
    </style>
  </head>
  <body>
    <div id="splash">
      <img src="/logo.svg" alt="LUSSO BRAND KR" />
      <div class="brand">LUSSO BRAND KR</div>
      <div class="bar"></div>
    </div>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
