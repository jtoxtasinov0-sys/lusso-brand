# Render.com Blueprint — backend'ni avtomatik sozlaydi.
# Render > New > Blueprint > shu repo'ni tanlang.
services:
  - type: web
    name: lusso-brand
    runtime: node
    plan: free
    region: singapore
    rootDir: backend
    buildCommand: npm install && npx prisma generate && npx prisma db push
    startCommand: npm start
    healthCheckPath: /
    envVars:
      # Qiymatlarini Render panelida o'zingiz kiritasiz (sync: false = maxfiy)
      - key: DATABASE_URL       # Neon.tech connection string
        sync: false
      - key: BOT_TOKEN          # BotFather tokeni
        sync: false
      - key: ADMIN_IDS          # Telegram ID lar, vergul bilan
        sync: false
      - key: ADMIN_PASSWORD     # admin panel paroli
        sync: false
      - key: JWT_SECRET
        generateValue: true     # Render o'zi tasodifiy qiymat yaratadi
      - key: WEB_APP_URL        # Vercel miniapp manzili
        sync: false
      - key: ADMIN_PANEL_URL    # Vercel admin manzili
        sync: false
      - key: PUBLIC_URL         # https://lusso-brand.onrender.com
        sync: false
      - key: SKIP_INITDATA_CHECK
        value: "false"          # PRODUCTION'da doimo false!
      - key: NODE_VERSION
        value: "22"
