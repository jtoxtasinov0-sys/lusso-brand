<!doctype html>
<html lang="uz">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover"
    />
    <title>ADMIN — LUSSO BRAND KR</title>
    <meta name="theme-color" content="#161514" />
    <link rel="icon" type="image/png" href="/icon-64.png" />
    <link rel="apple-touch-icon" href="/icon-180.png" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <!-- Panel bot ichida Mini App bo'lib ochilishi uchun -->
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <style>
      /* Panel yuklanguncha chiqadigan ADMIN logo ekrani — do'kondan ajralib turadi */
      #splash {
        position: fixed;
        inset: 0;
        z-index: 9999;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 20px;
        background:
          radial-gradient(40% 30% at 50% 40%, rgba(214, 174, 81, 0.22), transparent 70%),
          radial-gradient(circle at 50% 42%, #2c2925 0%, #161514 62%);
        transition: opacity 0.45s ease, visibility 0.45s ease;
      }
      #splash.hide {
        opacity: 0;
        visibility: hidden;
      }
      #splash img {
        width: 168px;
        height: 168px;
        border-radius: 50%;
        box-shadow: 0 0 0 10px rgba(214, 174, 81, 0.08), 0 0 90px rgba(214, 174, 81, 0.35);
        animation: splash-in 0.7s cubic-bezier(0.2, 0.9, 0.3, 1) both;
      }
      #splash .brand {
        padding: 7px 16px 7px calc(16px + 0.42em);
        border-radius: 20px;
        border: 1px solid rgba(214, 174, 81, 0.45);
        background: linear-gradient(120deg, rgba(241, 213, 138, 0.16), rgba(168, 130, 46, 0.08));
        color: #f1d58a;
        font: 800 13px/1 -apple-system, 'Segoe UI', Roboto, sans-serif;
        letter-spacing: 0.42em;
        animation: splash-in 0.7s 0.15s cubic-bezier(0.2, 0.9, 0.3, 1) both;
      }
      #splash .bar {
        width: 120px;
        height: 2px;
        border-radius: 2px;
        background: rgba(214, 174, 81, 0.18);
        overflow: hidden;
      }
      #splash .bar::after {
        content: '';
        display: block;
        width: 40%;
        height: 100%;
        background: #d6ae51;
        animation: splash-bar 1.1s ease-in-out infinite;
      }
      @keyframes splash-in {
        from {
          opacity: 0;
          transform: translateY(12px) scale(0.94);
        }
      }
      @keyframes splash-bar {
        from {
          transform: translateX(-100%);
        }
        to {
          transform: translateX(250%);
        }
      }
    </style>
  </head>
  <body>
    <div id="splash">
      <img src="/logo.png" alt="ADMIN" />
      <div class="brand">ADMIN PANEL</div>
      <div class="bar"></div>
    </div>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
